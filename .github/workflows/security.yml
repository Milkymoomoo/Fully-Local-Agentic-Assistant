# Source and supply-chain scans on every push and weekly, plus a weekly VirusTotal recheck of the newest release.
# Each scan's counts (no code, no secrets) are appended to security/history/ on gh-pages by the "record" job.
name: Security scans
on:
  push:
  schedule:
    - cron: "23 5 * * 1"        # Mondays 05:23 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload to code scanning (needs code scanning enabled in the repo settings)
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: c-cpp
            build-mode: none     # no NDK build in CI; CodeQL reads the C/C++ sources directly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Compile Kotlin/Java (no native build, no signing)
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon --no-configuration-cache :app:compileDebugKotlin :app:compileDebugJavaWithJavac :downloader:compileDebugKotlin
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
          retention-days: 30

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history, redacted)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml --report-format json --report-path gitleaks.json --exit-code 0
          python3 -c "import json; print(len(json.load(open('gitleaks.json'))), 'findings')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: gitleaks.json
          retention-days: 30

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner (dependencies + vendored C/C++)
        env:
          OSV_VERSION: "2.7.1"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output osv.json . || true
          test -s osv.json || echo '{"results":[]}' > osv.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv
          path: osv.json
          retention-days: 30

  virustotal-recheck:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read gh-pages state
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then git worktree add site FETCH_HEAD; else mkdir -p site/security; fi
      - name: Recheck the newest release on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 tools/security/vt.py recheck --site site --out vt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal
          path: |
            vt.json
            site/security/queue.json
            site/security/quota.json
          retention-days: 30
          if-no-files-found: ignore

  record:
    needs: [codeql, gitleaks, osv, virustotal-recheck]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # push the results to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
      - name: Summarize and append to the history
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tools/security/pages.sh open site
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          r=()
          if [ -d reports/codeql-java-kotlin ] || [ -d reports/codeql-c-cpp ]; then
            mkdir -p sarif; cp reports/codeql-*/*.sarif sarif/ 2>/dev/null || true
            python3 tools/security/summarize.py codeql sarif --out codeql.json --report-url "$RUN_URL" && r+=(codeql.json); fi
          [ -f reports/gitleaks/gitleaks.json ] && python3 tools/security/summarize.py gitleaks reports/gitleaks/gitleaks.json --out gl.json --report-url "$RUN_URL" && r+=(gl.json)
          [ -f reports/osv/osv.json ] && python3 tools/security/summarize.py osv reports/osv/osv.json --out osv.json --report-url "$RUN_URL" && r+=(osv.json)
          if [ -f reports/virustotal/vt.json ]; then
            r+=(reports/virustotal/vt.json)
            python3 tools/security/merge_state.py reports/virustotal/site/security site/security
          fi
          # Scorecard's public result (published by scorecard.yml), when there is one
          if curl -sSf "https://api.scorecard.dev/projects/github.com/$GITHUB_REPOSITORY" -o scorecard.json; then
            python3 tools/security/summarize.py scorecard scorecard.json --out sc.json \
              --report-url "https://scorecard.dev/viewer/?uri=github.com/$GITHUB_REPOSITORY" && r+=(sc.json); fi
          [ ${#r[@]} -gt 0 ] || { echo "no results"; exit 0; }
          python3 tools/security/record.py --site site --version "$version" --commit "$GITHUB_SHA" --run-url "$RUN_URL" "${r[@]}"
          tools/security/pages.sh push site "Security scans for $GITHUB_SHA ($GITHUB_EVENT_NAME)"
